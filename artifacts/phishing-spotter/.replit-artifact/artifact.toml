kind = "web"
previewPath = "/"
title = "Phishing & Pharming Spotter"
version = "1.0.0"
id = "artifacts/phishing-spotter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23040

[services.development]
run = "pnpm --filter @workspace/phishing-spotter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/phishing-spotter", "run", "build" ]
publicDir = "artifacts/phishing-spotter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23040"
BASE_PATH = "/"
